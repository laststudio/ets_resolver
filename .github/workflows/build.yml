name: Build and Create Release on Push

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    outputs:
      # 输出生成的 release tag（唯一）
      release_tag: ${{ steps.gen_tag.outputs.tag }}
      # 输出从 Cargo.toml 读取的版本号，供后续步骤使用
      version: ${{ steps.read_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add wasm32-unknown-unknown
          rustup target add x86_64-pc-windows-msvc

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      # ---------- 缓存 Android NDK ----------
      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v3
        with:
          path: C:\android-ndk-r25c
          key: ndk-windows-r25c

      - name: Download and install Android NDK (if not cached)
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          $ndkVersion = "r25c"
          $ndkZip = "android-ndk-$ndkVersion-windows.zip"
          $ndkUrl = "https://dl.google.com/android/repository/$ndkZip"
          Write-Host "Downloading NDK..."
          Invoke-WebRequest -Uri $ndkUrl -OutFile $ndkZip
          Expand-Archive -Path $ndkZip -DestinationPath C:\
          Remove-Item $ndkZip
        shell: pwsh

      - name: Set ANDROID_NDK_HOME
        run: |
          echo "ANDROID_NDK_HOME=C:\android-ndk-r25c" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Cache cargo registry and target
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ---------- 从 Cargo.toml 读取版本号 ----------
      - name: Read version from Cargo.toml
        id: read_version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "version=$version" >> $GITHUB_OUTPUT
        shell: bash

      # ---------- 生成唯一 Tag：版本号 + 短哈希 ----------
      - name: Generate release tag
        id: gen_tag
        run: |
          version="${{ steps.read_version.outputs.version }}"
          short_hash=$(git rev-parse --short HEAD)
          tag="v${version}-${short_hash}"
          echo "tag=$tag" >> $GITHUB_OUTPUT
        shell: bash

      - name: Build Windows MSVC (x86_64)
        run: cargo build --target x86_64-pc-windows-msvc --release

      - name: Build WebAssembly (wasm32)
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Build Android arm64-v8a
        run: cargo ndk --target arm64-v8a build --release

      # ---------- 打包动态库（含 .lib） ----------
      - name: Package dynamic libraries
        run: |
          mkdir artifacts
          # Windows: .dll + .lib 导入库
          cp target/x86_64-pc-windows-msvc/release/*.dll artifacts/ 2>/dev/null || true
          cp target/x86_64-pc-windows-msvc/release/*.lib artifacts/ 2>/dev/null || true
          # WebAssembly
          cp target/wasm32-unknown-unknown/release/*.wasm artifacts/ 2>/dev/null || true
          # Android
          cp target/aarch64-linux-android/release/*.so artifacts/ 2>/dev/null || true
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: built-libs-${{ steps.gen_tag.outputs.tag }}
          path: artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built libraries
        uses: actions/download-artifact@v4
        with:
          name: built-libs-${{ needs.build.outputs.release_tag }}
          path: artifacts/

      - name: Create Release (正式版)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: "Release v${{ needs.build.outputs.version }} (build ${{ github.sha }})"
          body: |
            自动构建的正式版动态库，版本号：${{ needs.build.outputs.version }}
            
            **包含文件：**
            - Windows: `.dll` + `.lib`（导入库）
            - WebAssembly: `.wasm`
            - Android: `.so`
            
            提交哈希：${{ github.sha }}
          # 不指定 prerelease，默认 false（正式版）
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}