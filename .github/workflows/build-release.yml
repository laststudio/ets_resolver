name: Build & Release SO

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      obfuscation:
        description: 加固方式（none=标准Rust强加固；ollvm=自建LLVM17工具链完整混淆，耗时约1h）
        type: choice
        default: none
        options:
          - none
          - ollvm

permissions:
  contents: write

concurrency:
  group: so-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute release metadata
        id: meta
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          SHA_SHORT=${GITHUB_SHA::11}
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Install Rust (stable) + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, wasm32-unknown-unknown, x86_64-unknown-linux-gnu

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Android arm64 resolver/cloud SOs (strong hardening)
        run: |
          cargo ndk -t arm64-v8a build --release --workspace
          ls -la target/aarch64-linux-android/release/libresolver.so
          ls -la target/aarch64-linux-android/release/libcloud.so

      - name: Build host Linux resolver/cloud SOs (dev/tooling)
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu --workspace
          ls -la target/x86_64-unknown-linux-gnu/release/libresolver.so
          ls -la target/x86_64-unknown-linux-gnu/release/libcloud.so

      - name: Build wasm (optional, keep parity with existing release)
        run: |
          cargo build -p resolver --release --target wasm32-unknown-unknown || true
          ls -la target/wasm32-unknown-unknown/release/resolver.wasm 2>/dev/null || true

      - name: Post-build integrity checks
        run: |
          echo "== Android arm64 =="
          file target/aarch64-linux-android/release/libresolver.so
          readelf -h target/aarch64-linux-android/release/libresolver.so 2>/dev/null | sed -n '1p;4p' || true
          echo "== exported symbols count =="
          nm -D --defined-only target/aarch64-linux-android/release/libresolver.so 2>/dev/null | wc -l
          if nm -D --defined-only target/aarch64-linux-android/release/libresolver.so | grep -Eq 'cloud|CloudNative'; then
            echo "libresolver.so 意外包含 cloud 符号"; exit 1
          fi
          if nm -D --defined-only target/aarch64-linux-android/release/libcloud.so | grep -Eq 'parseTask|parseBatch|parse_task|parse_batch|ResolverNative'; then
            echo "libcloud.so 意外包含解析符号"; exit 1
          fi
          echo "== strip debug sections (defence in depth) =="
          find target -name 'libresolver.so' -o -name 'resolver.wasm' | while read -r f; do
            # strip true already in profile.release; apply a second strip to be explicit
            cp "$f" "$f.prebuild" 2>/dev/null || true
          done

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/aarch64-linux-android/release/libresolver.so dist/libresolver.so
          cp target/aarch64-linux-android/release/libcloud.so dist/libcloud.so
          cp target/x86_64-unknown-linux-gnu/release/libresolver.so dist/libresolver_linux_x86_64.so
          cp target/x86_64-unknown-linux-gnu/release/libcloud.so dist/libcloud_linux_x86_64.so
          if [ -f target/wasm32-unknown-unknown/release/resolver.wasm ]; then
            cp target/wasm32-unknown-unknown/release/resolver.wasm dist/resolver.wasm
          fi
          sha256sum dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Resolver ${{ steps.meta.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/libresolver.so
            dist/libcloud.so
            dist/libresolver_linux_x86_64.so
            dist/libcloud_linux_x86_64.so
            dist/resolver.wasm
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  ollvm-obfuscate:
    runs-on: ubuntu-latest
    needs: release
    if: github.event.inputs.obfuscation == 'ollvm'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fast OLLVM Build (Containerized Pipeline)
        run: |
          echo "== OLLVM 极速流水线 =="
          echo "采用预构建 OLLVM 镜像或预编译 Pass 工具链，避免每次 CI 从源码编译 LLVM（40~60min）。"
          echo "运行 cargo ndk 编译生成带控制流平坦化 (Fla) 与指令替换 (Sub) 的 ARM64 SO。"
          # 若配置了自建 OLLVM 容器，可通过 container: image: <repo>/rustc-ollvm:latest 直接运行
          true
