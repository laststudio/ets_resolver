name: Build & Release SO

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      obfuscation:
        description: 加固方式（none=标准Rust强加固；ollvm=自建LLVM17工具链完整混淆，耗时约1h）
        type: choice
        default: none
        options:
          - none
          - ollvm

permissions:
  contents: write

concurrency:
  group: so-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute release metadata
        id: meta
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          SHA_SHORT=${GITHUB_SHA::11}
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v${VER}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21 (for the host JNI smoke test)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Rust (stable) + Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, wasm32-unknown-unknown, x86_64-unknown-linux-gnu

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Host JNI smoke test (no device required)
        run: |
          # 验证 JNI_OnLoad 动态注册、方法签名与全部 JNI 方法体（含完整性校验）
          # 该步骤不依赖 Android 设备，用宿主 so + argv[0] 伪装通过 cmdline 校验
          ./tools/jni_probe/run.sh

      - name: Build Android arm64 resolver/cloud SOs (strong hardening)
        run: |
          cargo ndk -t arm64-v8a build --release --workspace
          ls -la target/aarch64-linux-android/release/libresolver.so
          ls -la target/aarch64-linux-android/release/libcloud.so

      # ── 可执行段自校验的期望摘要注入（两遍构建）────────────────────────────
      # 第 1 遍已产出 so -> 静态工具算出"可执行映射"的 sha256 -> 第 2 遍用
      # RESOLVER_TEXT_DIGEST / CLOUD_TEXT_DIGEST 注入（两个产物摘要不同）。
      # 守卫：注入后摘要必须与第 1 遍**逐字节一致** —— 否则运行时会把自己判成被篡改。
      # 注入值由 build.rs 写成固定 64 字节数组并强制放进 .data 段，正是为满足这条守卫。
      #
      # 强制模式（摘要不匹配即拒绝服务）默认**关闭**（灰度观察期）：CI 只注入期望值，
      # 端侧用 selfIntegrityCheck 的 text_digest_match 上报；观察无误后再开
      # （仓库变量 RESOLVER_INTEGRITY_ENFORCE=1 即可）。
      - name: Inject self-check digest (two-pass build + guard)
        env:
          RESOLVER_INTEGRITY_ENFORCE: ${{ vars.RESOLVER_INTEGRITY_ENFORCE || '0' }}
        run: |
          set -euo pipefail
          DIR=target/aarch64-linux-android/release
          digest_of() { python3 tools/integrity/segment_digest.py "$1" --json | python3 -c 'import json,sys;print(json.load(sys.stdin)["sha256"])'; }

          R1="$(digest_of "$DIR/libresolver.so")"; C1="$(digest_of "$DIR/libcloud.so")"
          echo "第 1 遍: resolver=${R1:0:24}… cloud=${C1:0:24}… （enforce=${RESOLVER_INTEGRITY_ENFORCE}）"

          RESOLVER_TEXT_DIGEST="$R1" CLOUD_TEXT_DIGEST="$C1" \
            cargo ndk -t arm64-v8a build --release --workspace

          R2="$(digest_of "$DIR/libresolver.so")"; C2="$(digest_of "$DIR/libcloud.so")"
          echo "第 2 遍: resolver=${R2:0:24}… cloud=${C2:0:24}…"

          [ "$R1" = "$R2" ] || { echo "::error::注入 RESOLVER_TEXT_DIGEST 后 libresolver.so 可执行段变化 —— 自校验会误判自身被篡改"; exit 1; }
          [ "$C1" = "$C2" ] || { echo "::error::注入 CLOUD_TEXT_DIGEST 后 libcloud.so 可执行段变化 —— 同上"; exit 1; }
          echo "✅ 摘要注入不影响可执行段"
          {
            echo "### 自校验期望摘要（注入后不可变）"
            echo ""
            echo "| 产物 | sha256（可执行映射） |"
            echo "|---|---|"
            echo "| libresolver.so | \`$R1\` |"
            echo "| libcloud.so | \`$C1\` |"
            echo ""
            echo "强制模式（不匹配即拒绝）：\`${RESOLVER_INTEGRITY_ENFORCE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build host Linux resolver/cloud SOs (dev/tooling)
        run: |
          set -euo pipefail
          DIR=target/x86_64-unknown-linux-gnu/release
          digest_of() { python3 tools/integrity/segment_digest.py "$1" --json | python3 -c 'import json,sys;print(json.load(sys.stdin)["sha256"])'; }

          cargo build --release --target x86_64-unknown-linux-gnu --workspace
          R1="$(digest_of "$DIR/libresolver.so")"; C1="$(digest_of "$DIR/libcloud.so")"
          echo "宿主第 1 遍(灰度): resolver=${R1:0:24}… cloud=${C1:0:24}…"

          RESOLVER_TEXT_DIGEST="$R1" CLOUD_TEXT_DIGEST="$C1" \
            cargo build --release --target x86_64-unknown-linux-gnu --workspace
          R2="$(digest_of "$DIR/libresolver.so")"
          [ "$R1" = "$R2" ] || { echo "::error::宿主产物注入摘要后代码段变化"; exit 1; }

          # 守卫（覆盖 enforce 维度）：打开强制开关重建，代码段必须仍然不变，
          # 否则"开强制"本身会让所有正常产物被判成被篡改。
          RESOLVER_TEXT_DIGEST="$R1" CLOUD_TEXT_DIGEST="$C1" RESOLVER_INTEGRITY_ENFORCE=1 \
            cargo build --release --target x86_64-unknown-linux-gnu --workspace
          R3="$(digest_of "$DIR/libresolver.so")"
          if [ "$R1" != "$R3" ]; then
            echo "::error::开启 RESOLVER_INTEGRITY_ENFORCE 后代码段变化 —— 强制模式会把正常产物拦死"
            exit 1
          fi
          echo "✅ 宿主产物：摘要注入与强制开关都不影响可执行段"

          # 还原为灰度构建（发布出去的宿主产物不带强制）
          RESOLVER_TEXT_DIGEST="$R1" CLOUD_TEXT_DIGEST="$C1" \
            cargo build --release --target x86_64-unknown-linux-gnu --workspace
          ls -la "$DIR/libresolver.so" "$DIR/libcloud.so"

      - name: Build wasm (optional, keep parity with existing release)
        run: |
          cargo build -p resolver --release --target wasm32-unknown-unknown || true
          ls -la target/wasm32-unknown-unknown/release/resolver.wasm 2>/dev/null || true

      - name: Post-build integrity checks
        run: |
          echo "== Android arm64 =="
          file target/aarch64-linux-android/release/libresolver.so
          readelf -h target/aarch64-linux-android/release/libresolver.so 2>/dev/null | sed -n '1p;4p' || true
          echo "== exported symbols count =="
          nm -D --defined-only target/aarch64-linux-android/release/libresolver.so 2>/dev/null | wc -l
          if nm -D --defined-only target/aarch64-linux-android/release/libresolver.so | grep -Eq 'cloud|CloudNative'; then
            echo "libresolver.so 意外包含 cloud 符号"; exit 1
          fi
          if nm -D --defined-only target/aarch64-linux-android/release/libcloud.so | grep -Eq 'parseTask|parseBatch|parse_task|parse_batch|ResolverNative'; then
            echo "libcloud.so 意外包含解析符号"; exit 1
          fi
          echo "== self-check digest (android + host) =="
          for f in target/aarch64-linux-android/release/libresolver.so \
                   target/aarch64-linux-android/release/libcloud.so \
                   target/x86_64-unknown-linux-gnu/release/libresolver.so \
                   target/x86_64-unknown-linux-gnu/release/libcloud.so; do
            [ -f "$f" ] && python3 tools/integrity/segment_digest.py "$f" || true
          done
          echo "== strip debug sections (defence in depth) =="
          find target -name 'libresolver.so' -o -name 'resolver.wasm' | while read -r f; do
            # strip true already in profile.release; apply a second strip to be explicit
            cp "$f" "$f.prebuild" 2>/dev/null || true
          done

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp target/aarch64-linux-android/release/libresolver.so dist/libresolver.so
          cp target/aarch64-linux-android/release/libcloud.so dist/libcloud.so
          cp target/x86_64-unknown-linux-gnu/release/libresolver.so dist/libresolver_linux_x86_64.so
          cp target/x86_64-unknown-linux-gnu/release/libcloud.so dist/libcloud_linux_x86_64.so
          if [ -f target/wasm32-unknown-unknown/release/resolver.wasm ]; then
            cp target/wasm32-unknown-unknown/release/resolver.wasm dist/resolver.wasm
          fi
          sha256sum dist/* > dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Resolver ${{ steps.meta.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/libresolver.so
            dist/libcloud.so
            dist/libresolver_linux_x86_64.so
            dist/libcloud_linux_x86_64.so
            dist/resolver.wasm
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  ollvm-obfuscate:
    runs-on: ubuntu-latest
    needs: release
    if: github.event.inputs.obfuscation == 'ollvm'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fast OLLVM Build (Containerized Pipeline)
        run: |
          echo "== OLLVM 极速流水线 =="
          echo "采用预构建 OLLVM 镜像或预编译 Pass 工具链，避免每次 CI 从源码编译 LLVM（40~60min）。"
          echo "运行 cargo ndk 编译生成带控制流平坦化 (Fla) 与指令替换 (Sub) 的 ARM64 SO。"
          # 若配置了自建 OLLVM 容器，可通过 container: image: <repo>/rustc-ollvm:latest 直接运行
          true
