[package]
name = "resolver"
version = "1.1.0"
edition = "2021"

[lib]
name = "resolver"
crate-type = ["cdylib"]   # 编译为动态链接库: libresolver.so / resolver.dll

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# 内部后端授权 (仅非 wasm 目标)
[target.'cfg(not(any(target_arch = "wasm32", target_arch = "wasm64")))'.dependencies]
ureq = { version = "2", features = ["tls"] }
base64 = "0.22"
ed25519-compact = "2"
getrandom = "0.2"
md5 = "0.7"
zip = { version = "2.4", default-features = false, features = ["aes-crypto", "deflate"] }
webpki-roots = "0.26"
url = "2"

# Android JNI 桥 (Fe-pro 调用)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
#opt-level = "z"
opt-level = 3
lto = "fat"
#lto = true
codegen-units = 1
panic = "abort"
incremental = false
strip = true
debug = false
