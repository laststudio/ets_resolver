[package]
name = "resolver"
version = "1.2.0"
edition = "2021"

[workspace]
members = ["cloud"]
resolver = "2"

[features]
default = []
cloud-library = []

[lib]
name = "resolver"
# cdylib: libresolver.so / resolver.dll（下游 FFI/JNI 用）
# rlib:   供 tests/ 集成测试与未来的 CLI 直接 use（不改变 .so 的导出符号）
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
obfstr = "0.4"
sha2 = "0.10"

# 内部后端授权 (仅非 wasm 目标)
[target.'cfg(not(any(target_arch = "wasm32", target_arch = "wasm64")))'.dependencies]
ureq = { version = "2", features = ["tls"] }
base64 = "0.22"
ed25519-compact = "2"
getrandom = "0.2"

# Android JNI 桥 (Fe-pro 调用)
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
#opt-level = "z"
opt-level = 3
lto = "fat"
#lto = true
codegen-units = 1
panic = "abort"
incremental = false
strip = true
debug = false
