[package]
name = "resolver"
version = "1.0.0"
edition = "2021"

[lib]
name = "resolver"
crate-type = ["cdylib"]   # 编译为动态链接库: libresolver.so / resolver.dll

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
#opt-level = "z"
opt-level = 3
lto = "fat"
#lto = true
codegen-units = 1
panic = "abort"
incremental = false
strip = true
debug = false