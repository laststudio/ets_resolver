[package]
name = "ets_resolver"
version = "0.1.0"
edition = "2021"

[lib]
name = "ets_resolver"
crate-type = ["cdylib"]   # 编译为动态链接库: ets_resolver.so / ets_resolver.dylib / ets_resolver.dll

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
